object:
  name: Decision
  version: 0.1.0
  domain: delivery.decision
  description: >-
    A decision recorded while work was being done, and whether it still stands. Born from the
    strategic_decisions table of Derek's CMOS store (1,933 rows read 2026-09-16); the field mapping
    and every column this object does not model are stated in the m02 fit read.
  tags:
    - delivery
    - cmos
    - decision

traits:
  - name: lifecycle/Supersedable
    parameters:
      states:
        - active
        - superseded
        - archived
        - stale
      initialState: active
      recordedDirection: forward
  - name: lifecycle/Timestampable
    parameters:
      recordedEvents:
        - captured
      timezone: UTC
  - name: core/Classifiable
    alias: DecisionCategory
  - name: behavioral/Searchable
    parameters:
      placeholder: Search decisions
  - name: behavioral/Filterable
  - name: behavioral/Pageable
    parameters:
      defaultPageSize: 20
      pageSizeOptions:
        - 10
        - 20
        - 50
        - 100

schema:
  decision_id:
    type: string
    required: true
    description: >-
      The record's own identifier. CMOS assigns an integer; the object declares a string so the same
      shape carries another store's identifiers without coercion.
    validation:
      minLength: 1
      maxLength: 64
  decision_text:
    type: string
    required: true
    description: >-
      The decision as it was written. The longest free text this registry carries: 61 to 8,418
      characters in the live store, with 197 of 1,933 rows over 2,000, so every context that shows it
      must stay readable at 390 without hiding meaning.
    validation:
      minLength: 1
  sprint_id:
    type: string
    required: false
    description: The sprint the decision was taken in. Every non-null value in the live store resolves against a sprint, none dangling.
  mission_id:
    type: string
    required: false
    description: >-
      The mission that captured it, as CMOS stores it. Recorded loosely — often a bare "m02" rather
      than a fully qualified "s203-m02" — so it is shown as a label and never as a resolved link.
  session_id:
    type: string
    required: false
    description: The session that recorded the decision. Null on 838 of 1,933 rows.
  project_id:
    type: string
    required: true
    description: The project the decision belongs to. A slug such as "forge", never a uuid.
  project_domain:
    type: string
    required: false
    description: Optional area within the project. Sparse — null on 1,850 of 1,933 rows.
  evidence:
    type: object[]
    required: false
    description: >-
      What the decision cites, as {type, id} references. Sparse (null on 1,923 rows) but real, and
      the rows a preview shows beside a design.

semantics:
  decision_id:
    semantic_type: delivery.decision.id
    token_mapping: tokenMap(text.body.*)
  decision_text:
    semantic_type: delivery.decision.text
    token_mapping: tokenMap(text.body.*)
  sprint_id:
    semantic_type: delivery.decision.sprint_id
    token_mapping: tokenMap(text.body.*)
  mission_id:
    semantic_type: delivery.decision.mission_id
    token_mapping: tokenMap(text.body.*)
  session_id:
    semantic_type: delivery.decision.session_id
    token_mapping: tokenMap(text.body.*)
  project_id:
    semantic_type: delivery.decision.project_id
    token_mapping: tokenMap(text.body.*)
  project_domain:
    semantic_type: delivery.decision.project_domain
    token_mapping: tokenMap(text.body.*)
  evidence:
    semantic_type: delivery.decision.evidence
    token_mapping: tokenMap(text.body.*)

metadata:
  maturity: alpha
  owners:
    - Forge
  references:
    - "artifacts/product-reality/sprint-203/m02/fit-read.json"
  changelog:
    - version: 0.1.0
      date: "2026-09-16"
      description: Born from the live strategic_decisions table, 1,933 rows.
