object:
  name: Report
  version: 0.1.0
  domain: research.synthesis
  description: 'TraceLab report: synthesis in the research notebook. API provenance and unavailable trait
    fields are specified in the TraceLab OODS mapping contract.'
  tags:
  - research
  - tracelab
  - synthesis
traits:
- name: content/Labelled
  parameters:
    maxLabelLength: 255
    maxDescriptionLength: 1000
- name: lifecycle/Stateful
  parameters:
    states: &id001
    - draft
    - final
    initialState: draft
- name: lifecycle/Timestampable
  parameters:
    recordedEvents:
    - created
    - updated
    timezone: UTC
- name: structural/Ownerable
  parameters:
    ownerTypes:
    - user
    primaryOwnerType: user
    allowTransfer: false
- name: behavioral/Searchable
  parameters:
    placeholder: Search reports
- name: behavioral/Filterable
- name: behavioral/Pageable
  parameters:
    defaultPageSize: 20
    pageSizeOptions:
    - 10
    - 20
    - 50
    - 100
schema:
  id:
    type: uuid
    required: true
    description: Id.
    validation:
      format: uuid
  title:
    type: string
    required: true
    description: Title.
  content:
    type: string
    required: true
    description: Content.
  citations:
    type: CitationSchema[]
    required: false
    description: Citations.
  tokens_used:
    type: number
    required: false
    description: Tokens used.
    default: 0
  status:
    type: string
    required: true
    description: Canonical research lifecycle. The API remains authoritative; do not coerce an unknown
      server value.
    validation:
      enum: *id001
  created_at:
    type: datetime
    required: true
    description: Created at.
    validation:
      format: date-time
  project_id:
    type: uuid
    required: false
    description: Project id.
  report_type:
    type: string
    required: false
    description: Report type.
    default: summary
  prompt:
    type: string
    required: false
    description: Prompt.
  chunk_count:
    type: number
    required: false
    description: Chunk count.
    default: 0
  sources:
    type: ReportSourceSchema[]
    required: false
    description: Sources.
  updated_at:
    type: datetime
    required: true
    description: Updated at.
    validation:
      format: date-time
  label:
    type: string
    required: true
    description: Display projection of title; retain the complete source field.
  owner_id:
    type: uuid
    required: false
    description: Authoritative nullable server owner_id. Not exposed by the current response; unavailable
      until the API exposes it. Never derive from created_by, user_id, or project owner.
  owner_type:
    type: string
    required: false
    description: user only when an authoritative owner_id is present.
    validation:
      enum:
      - user
  last_event:
    type: string
    required: false
    description: Only from an explicit event or timestamp projection; absence is unknown, not a fabricated
      audit event.
semantics:
  title:
    semantic_type: text.label
    token_mapping: tokenMap(text.label.*)
  project_id:
    semantic_type: research.report.project_id
    token_mapping: tokenMap(text.body.*)
  id:
    semantic_type: research.report.id
    token_mapping: tokenMap(text.body.*)
  content:
    semantic_type: research.report.content
    token_mapping: tokenMap(text.body.*)
  citations:
    semantic_type: research.report.citations
    token_mapping: tokenMap(text.body.*)
  tokens_used:
    semantic_type: research.report.tokens_used
    token_mapping: tokenMap(text.body.*)
  report_type:
    semantic_type: research.report.report_type
    token_mapping: tokenMap(text.body.*)
  prompt:
    semantic_type: research.report.prompt
    token_mapping: tokenMap(text.body.*)
  chunk_count:
    semantic_type: research.report.chunk_count
    token_mapping: tokenMap(text.body.*)
  sources:
    semantic_type: research.report.sources
    token_mapping: tokenMap(text.body.*)
metadata:
  maturity: alpha
  owners:
  - TraceLab
  references:
  - https://github.com/kneelinghorse/TraceLab/blob/main/cmos/contracts/oods-object-model.md
  changelog:
  - version: 0.1.0
    date: '2026-09-12'
    description: UX-1 research model from TraceLab Pydantic responses.
