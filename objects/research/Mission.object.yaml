object:
  name: Mission
  version: 0.1.0
  domain: research.job
  description: 'TraceLab mission: job in the research notebook. API provenance and unavailable trait fields
    are specified in the TraceLab OODS mapping contract.'
  tags:
  - research
  - tracelab
  - job
traits:
- name: content/Labelled
  parameters:
    maxLabelLength: 255
    maxDescriptionLength: 1000
- name: lifecycle/Stateful
  parameters:
    states: &id001
    - draft
    - queued
    - in_progress
    - completed
    - blocked
    - cancelled
    - validation_failed
    initialState: draft
- name: lifecycle/Timestampable
  parameters:
    recordedEvents:
    - created
    - queued
    - started
    - completed
    - updated
    timezone: UTC
- name: structural/Ownerable
  parameters:
    ownerTypes:
    - user
    primaryOwnerType: user
    allowTransfer: false
- name: behavioral/Taggable
  parameters:
    maxTags: 50
    allowCustomTags: true
    caseSensitive: true
- name: lifecycle/Cancellable
  parameters:
    allowCancellationAfterStart: true
    requireReason: false
- name: behavioral/Searchable
  parameters:
    placeholder: Search missions
- name: behavioral/Filterable
- name: behavioral/Pageable
  parameters:
    defaultPageSize: 20
    pageSizeOptions:
    - 10
    - 20
    - 50
    - 100
schema:
  mission_id:
    type: string
    required: true
    description: Human-readable mission identifier (e.g., B16.1)
    validation:
      maxLength: 50
      minLength: 1
  title:
    type: string
    required: true
    description: Mission title
    validation: &id002
      maxLength: 255
      minLength: 3
  objective:
    type: string
    required: true
    description: What this mission aims to achieve (minimum 10 characters)
    validation: &id003
      minLength: 10
  success_criteria:
    type: string[]
    required: true
    description: Array of measurable success conditions
    validation:
      minItems: 1
  id:
    type: uuid
    required: true
    description: Id.
    validation:
      format: uuid
  project_id:
    type: uuid
    required: false
    description: Project id.
  project_name:
    type: string
    required: false
    description: Name of the associated project
  context:
    type: object
    required: false
    description: Context.
  deliverables:
    type: string[]
    required: false
    description: Deliverables.
  research_phases:
    type: object
    required: false
    description: Research phases.
  tags:
    type: string[]
    required: false
    description: Tags.
  metadata:
    type: object
    required: false
    description: Metadata.
  background:
    type: string
    required: false
    description: Background.
  focus:
    type: string
    required: false
    description: Focus.
  references:
    type: object[]
    required: false
    description: References.
  required_entities:
    type: string[]
    required: false
    description: Required entities.
  excluded_entities:
    type: string[]
    required: false
    description: Excluded entities.
  expected_output_schema:
    type: object
    required: false
    description: Expected output schema.
  coverage_thresholds:
    type: object
    required: false
    description: Coverage thresholds.
  validation_thresholds:
    type: object
    required: false
    description: Validation thresholds.
  deliverable_format:
    type: string
    required: false
    description: Deliverable format.
  max_loops:
    type: number
    required: false
    description: Max loops.
  min_loops:
    type: number
    required: false
    description: Min loops.
  constraints:
    type: string[]
    required: false
    description: Constraints.
  status:
    type: string
    required: true
    description: Canonical research lifecycle. The API remains authoritative; do not coerce an unknown
      server value.
    validation:
      enum: *id001
  queued_at:
    type: datetime
    required: false
    description: Queued at.
  started_at:
    type: datetime
    required: false
    description: Started at.
  completed_at:
    type: datetime
    required: false
    description: Completed at.
  deepsearch_job_id:
    type: string
    required: false
    description: Deepsearch job id.
  execution_metadata:
    type: object
    required: false
    description: Execution metadata.
  result_document_ids:
    type: uuid[]
    required: false
    description: Result document ids.
  result_report_id:
    type: uuid
    required: false
    description: Result report id.
  result_markdown:
    type: string
    required: false
    description: Result markdown.
  result_protocol:
    type: object
    required: false
    description: Result protocol.
  error_message:
    type: string
    required: false
    description: Error message.
  created_at:
    type: datetime
    required: true
    description: Created at.
    validation:
      format: date-time
  updated_at:
    type: datetime
    required: true
    description: Updated at.
    validation:
      format: date-time
  created_by:
    type: string
    required: false
    description: Created by.
  progress_percent:
    type: number
    required: false
    description: Progress percent.
  current_phase:
    type: string
    required: false
    description: Current phase.
  deepsearch_attempt_count:
    type: number
    required: false
    description: Deepsearch attempt count.
    default: 0
  lease_expires_at:
    type: datetime
    required: false
    description: Lease expires at.
  materialization_pending:
    type: boolean
    required: true
    description: Materialization pending.
  materialization_status:
    type: string
    required: false
    description: Materialization status.
  materialization_attempt_count:
    type: number
    required: false
    description: Materialization attempt count.
    default: 0
  materialization_error:
    type: string
    required: false
    description: Materialization error.
  search_ready:
    type: boolean
    required: true
    description: Search ready.
  label:
    type: string
    required: true
    description: Display projection of title; retain the complete source field.
    validation: *id002
  description:
    type: string
    required: true
    description: Display projection of objective; never truncates persisted content.
    validation: *id003
  owner_id:
    type: uuid
    required: false
    description: Authoritative nullable server owner_id. Not exposed by the current response; unavailable
      until the API exposes it. Never derive from created_by, user_id, or project owner.
  owner_type:
    type: string
    required: false
    description: user only when an authoritative owner_id is present.
    validation:
      enum:
      - user
  last_event:
    type: string
    required: false
    description: Only from an explicit event or timestamp projection; absence is unknown, not a fabricated
      audit event.
  cancel_at_period_end:
    type: boolean
    required: false
    default: false
    description: TraceLab cancellation is immediate; no billing period exists. Period-end controls must
      not be used.
