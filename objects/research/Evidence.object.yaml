object:
  name: Evidence
  version: 0.1.0
  domain: research.data
  description: 'TraceLab evidence: data in the research notebook. API provenance and unavailable trait
    fields are specified in the TraceLab OODS mapping contract.'
  tags:
  - research
  - tracelab
  - data
traits:
- name: content/Labelled
  parameters:
    maxLabelLength: 255
    maxDescriptionLength: 1000
- name: lifecycle/Timestampable
  parameters:
    recordedEvents:
    - created
    - updated
    timezone: UTC
- name: structural/Ownerable
  parameters:
    ownerTypes:
    - user
    primaryOwnerType: user
    allowTransfer: false
- name: core/Classifiable
  parameters:
    classification_mode: hybrid
    tag_policy: open
    max_tags: 50
    require_primary_category: true
- name: behavioral/Searchable
  parameters:
    placeholder: Search evidences
- name: behavioral/Filterable
- name: behavioral/Pageable
  parameters:
    defaultPageSize: 20
    pageSizeOptions:
    - 10
    - 20
    - 50
    - 100
schema:
  id:
    type: uuid
    required: true
    description: Id.
    validation:
      format: uuid
  project_id:
    type: uuid
    required: true
    description: Project id.
    validation:
      format: uuid
  mission_id:
    type: uuid
    required: false
    description: Mission id.
  session_key:
    type: string
    required: true
    description: Session key.
  origin:
    type: string
    required: true
    description: Origin.
    validation:
      enum:
      - mcp-agent
      - deepsearch-worker
  claim:
    type: string
    required: true
    description: Claim.
  summary:
    type: string
    required: false
    description: Summary.
  source_url:
    type: string
    required: true
    description: Source url.
  source_id:
    type: uuid
    required: true
    description: Source id.
    validation:
      format: uuid
  source_sighting_count:
    type: number
    required: true
    description: Source sighting count.
    validation:
      minimum: 1
  snippet:
    type: string
    required: false
    description: Snippet.
  query:
    type: string
    required: false
    description: Query.
  disposition:
    type: string
    required: true
    description: Disposition.
    validation:
      enum:
      - supporting
      - contradicting
      - rejected
      - background
  tags:
    type: string[]
    required: true
    description: Tags.
  owner_id:
    type: uuid
    required: false
    description: Authoritative nullable server owner_id. Present in this response.
  workspace_id:
    type: uuid
    required: false
    description: Workspace id.
  created_at:
    type: datetime
    required: true
    description: Created at.
    validation:
      format: date-time
  updated_at:
    type: datetime
    required: true
    description: Updated at.
    validation:
      format: date-time
  label:
    type: string
    required: true
    description: Display projection of claim; retain the complete source field.
  description:
    type: string
    required: false
    description: Display projection of summary; never truncates persisted content.
  owner_type:
    type: string
    required: false
    description: user only when an authoritative owner_id is present.
    validation:
      enum:
      - user
  last_event:
    type: string
    required: false
    description: Only from an explicit event or timestamp projection; absence is unknown, not a fabricated
      audit event.
  primary_category_id:
    type: string
    required: true
    description: Exact disposition; classification dimension, never a lifecycle state.
    validation:
      enum:
      - supporting
      - contradicting
      - rejected
      - background
  categories:
    type: CategoryNode[]
    required: true
    description: One fixed category with id and label derived from disposition; no inferred taxonomy.
semantics:
  claim:
    semantic_type: text.label
    token_mapping: tokenMap(text.label.*)
  project_id:
    semantic_type: research.evidence.project_id
    token_mapping: tokenMap(text.body.*)
  workspace_id:
    semantic_type: research.evidence.workspace_id
    token_mapping: tokenMap(text.body.*)
  source_url:
    semantic_type: research.evidence.source_url
    token_mapping: tokenMap(text.body.*)
  source_sighting_count:
    semantic_type: research.evidence.source_sighting_count
    token_mapping: tokenMap(text.body.*)
  disposition:
    semantic_type: research.evidence.disposition
    token_mapping: tokenMap(text.body.*)
  id:
    semantic_type: research.evidence.id
    token_mapping: tokenMap(text.body.*)
  mission_id:
    semantic_type: research.evidence.mission_id
    token_mapping: tokenMap(text.body.*)
  session_key:
    semantic_type: research.evidence.session_key
    token_mapping: tokenMap(text.body.*)
  origin:
    semantic_type: research.evidence.origin
    token_mapping: tokenMap(text.body.*)
  summary:
    semantic_type: research.evidence.summary
    token_mapping: tokenMap(text.body.*)
  source_id:
    semantic_type: research.evidence.source_id
    token_mapping: tokenMap(text.body.*)
  snippet:
    semantic_type: research.evidence.snippet
    token_mapping: tokenMap(text.body.*)
  query:
    semantic_type: research.evidence.query
    token_mapping: tokenMap(text.body.*)
metadata:
  maturity: alpha
  owners:
  - TraceLab
  references:
  - https://github.com/kneelinghorse/TraceLab/blob/main/cmos/contracts/oods-object-model.md
  changelog:
  - version: 0.1.0
    date: '2026-09-12'
    description: UX-1 research model from TraceLab Pydantic responses.
