object:
  name: Collection
  version: 0.1.0
  domain: research.context
  description: 'TraceLab collection: context in the research notebook. API provenance and unavailable
    trait fields are specified in the TraceLab OODS mapping contract.'
  tags:
  - research
  - tracelab
  - context
traits:
- name: content/Labelled
  parameters:
    maxLabelLength: 255
    maxDescriptionLength: 1000
- name: lifecycle/Timestampable
  parameters:
    recordedEvents:
    - created
    - updated
    timezone: UTC
- name: structural/Ownerable
  parameters:
    ownerTypes:
    - user
    primaryOwnerType: user
    allowTransfer: false
- name: behavioral/Taggable
  parameters:
    maxTags: 50
    allowCustomTags: true
    caseSensitive: true
- name: behavioral/Searchable
  parameters:
    placeholder: Search collections
- name: behavioral/Filterable
- name: behavioral/Pageable
  parameters:
    defaultPageSize: 20
    pageSizeOptions:
    - 10
    - 20
    - 50
    - 100
schema:
  name:
    type: string
    required: true
    description: Name.
    validation: &id001
      maxLength: 255
      minLength: 1
  description:
    type: string
    required: false
    description: Display projection of description; never truncates persisted content.
  id:
    type: uuid
    required: true
    description: Id.
    validation:
      format: uuid
  created_at:
    type: datetime
    required: true
    description: Created at.
    validation:
      format: date-time
  updated_at:
    type: datetime
    required: true
    description: Updated at.
    validation:
      format: date-time
  item_count:
    type: number
    required: false
    description: Number of chunks in collection
    default: 0
  items:
    type: CollectionItemResponse[]
    required: false
    description: Items.
  label:
    type: string
    required: true
    description: Display projection of name; retain the complete source field.
    validation: *id001
  owner_id:
    type: uuid
    required: false
    description: Authoritative nullable server owner_id. Not exposed by the current response; unavailable
      until the API exposes it. Never derive from created_by, user_id, or project owner.
  owner_type:
    type: string
    required: false
    description: user only when an authoritative owner_id is present.
    validation:
      enum:
      - user
  last_event:
    type: string
    required: false
    description: Only from an explicit event or timestamp projection; absence is unknown, not a fabricated
      audit event.
semantics:
  name:
    semantic_type: text.label
    token_mapping: tokenMap(text.label.*)
  id:
    semantic_type: research.collection.id
    token_mapping: tokenMap(text.body.*)
  item_count:
    semantic_type: research.collection.item_count
    token_mapping: tokenMap(text.body.*)
  items:
    semantic_type: research.collection.items
    token_mapping: tokenMap(text.body.*)
metadata:
  maturity: alpha
  owners:
  - TraceLab
  references:
  - https://github.com/kneelinghorse/TraceLab/blob/main/cmos/contracts/oods-object-model.md
  changelog:
  - version: 0.1.0
    date: '2026-09-12'
    description: UX-1 research model from TraceLab Pydantic responses.
