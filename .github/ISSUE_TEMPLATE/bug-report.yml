name: Bug report
description: Something behaved wrongly in the OODS Forge runtime or one of its tools
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. The tool call and its output are what make a bug reproducible; FEEDBACK.md says what else helps.

  - type: dropdown
    id: client
    attributes:
      label: Client
      description: How you were talking to Forge.
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - The HTTP bridge
        - Direct stdio (a script or another client)
        - Other
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: The release tag, or the `commit` field of `forge-runtime.manifest.json` inside the archive you extracted. Contributors working from a clone give the commit.
      placeholder: "v0.1.0 or a 40-character commit"
    validations:
      required: true

  - type: textarea
    id: call
    attributes:
      label: Tool call
      description: The tool name and the arguments as you (or your assistant) sent them.
      placeholder: |
        design.compose
        {"object": "Subscription", "context": "detail"}
      render: text
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: What came back, or the part of it that matters. Paste the error text verbatim when the call failed.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      placeholder: One or two lines.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node version (`node --version`).
      placeholder: |
        - OS: macOS 15
        - Node: v24.6.0
    validations:
      required: false
