name: CI

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'cmos/**'
  push:
    # s176 m04: the repo works on Forge-expansion → OODS-pro; with only `main` here a
    # push with no open PR ran nothing (measured 2026-08-24: PR #74 gated 4f64bcf — the
    # gap is exactly the no-open-PR window). `main` stays listed while the dead branch
    # exists (#1225 is Derek's call).
    branches: [ main, OODS-pro, Forge-expansion ]
    paths-ignore:
      - 'cmos/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build packages
        run: pnpm run build:packages

      - name: Check generated schema types are fresh
        run: pnpm --filter @oods/schemas-tools run generate:check

      - name: Check schema-derived types are fresh (Generator B, #681 retarget)
        run: pnpm run generate:schema-types -- --check

      - name: Check API reference docs are fresh (sprint-125 m05)
        run: pnpm -w run docs:api -- --check

      - name: Build workspace
        run: pnpm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sources
        run: pnpm run lint

      - name: Enum convergence lint
        run: pnpm run lint:enum-convergence

      # Dormant guards wired into CI (sprint-128 m04). Each passes on clean HEAD
      # (no baseline grandfathering); a new violation now reds the lint job.
      - name: Enum-to-token map lint
        run: pnpm run lint:enum-to-token

      - name: Audit-log immutability lint
        run: pnpm run lint:audit-log

      - name: Brand-bleed lint
        run: pnpm run lint:brand-bleed

      - name: Tokens lint
        run: pnpm run lint:tokens

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check workspace
        run: pnpm exec tsc --noEmit

      # s153 F1: the root tsc --noEmit does not reach packages/viz-core/src (tsup strips types,
      # vitest is runtime-only), so the public barrel re-exports (Mark/DataSource/EncodingMap/
      # Transform) had no red gate — deleting one left every check green. This per-package tsc
      # gates them via the src/**/*.example.spec.ts type witnesses.
      #
      # viz-core src imports @oods/tokens, whose types live ONLY in its generated dist
      # (packages/tokens has no src/index.ts — its src is DTCG JSON), so the root
      # @oods/* → packages/*/src alias cannot resolve it and it must be built first.
      # (@oods/a11y-tools DOES resolve via the src alias, so only tokens needs building.)
      - name: Build tokens (viz-core typecheck dependency)
        run: pnpm --filter @oods/tokens run build

      - name: Type check viz-core (re-export surface gate)
        run: pnpm --filter @oods/viz-core run typecheck

      # s174 m04 — build:stories is the ONLY type lens over stories/** and apps/explorer/**,
      # and until now nothing ran it: 268 errors had accumulated unobserved, including real
      # explorer drift that was invisible-to-green. It is wired as a STEP on this existing job
      # rather than a new one (the then-current 13 jobs stayed 13). The pin is exact in both directions — a drop
      # below it reds with "lower the pin", so headroom cannot silently accumulate.
      - name: build:stories type ratchet
        run: node scripts/quality/build-stories-ratchet.mjs

  tenancy:
    name: tenancy-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tenancy matrix
        run: pnpm tenancy:check

  tokens-validate:
    name: tokens-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Token collision guard
        # s167 m01: a PRE-LOAD check that no token path is declared twice with
        # differing values outside the declared brand overlay chain. Style Dictionary
        # deep-merges colliding paths at load and the last writer wins silently — that
        # is how brand A came to ship the forced-colors keyword `Highlight` as its
        # default colour on all five platforms. `build:tokens` also refuses to build
        # when this is red; it is pinned separately here so the failure is legible as
        # a collision rather than as a build error.
        run: pnpm run tokens:collision-guard

      - name: Validate design tokens
        # s149 #842: the COMPOSITE `tokens-validate` (hyphen), not `tokens:validate`
        # (colon = transform --check ONLY). The composite also runs lint-semantic,
        # guardrails --quiet, and validate-viz-scales — the viz-scale guardrail that
        # otherwise never ran in this job (it reached CI only via the coverage job's
        # root-vitest copy, so a red guardrail here would have been invisible).
        run: pnpm run tokens-validate

  diagnostics-schema:
    name: diagnostics-schema
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate diagnostics.json schema
        run: node scripts/validate-diagnostics-schema.mjs

  tokens-governance:
    name: tokens-governance
    # The diff, label lookup, and comment all consume pull_request-only context.
    # A push run has no github.event.pull_request.base.sha; running this matrix
    # there would pass an empty --base and create false failing checks.
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        brand: [A, B]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      # Query labels live: the event payload is frozen at trigger time, so a label
      # applied after the push (and any re-run) would never be seen through it.
      - name: Collect PR labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            labels=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" --jq '[.[].name] | join(",")')
          else
            labels=""
          fi
          echo "value=$labels" >> "$GITHUB_OUTPUT"

      - name: Run tokens-governance diff (Brand ${{ matrix.brand }})
        id: governance
        env:
          BRAND: ${{ matrix.brand }}
        run: |
          mkdir -p artifacts/tokens
          brand_lower=$(printf '%s' "$BRAND" | tr '[:upper:]' '[:lower:]')
          report="artifacts/tokens/brand-${brand_lower}-report.json"
          comment="artifacts/tokens/brand-${brand_lower}-comment.md"
          set +e
          pnpm run tokens:governance -- diff \
            --brand "$BRAND" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --json "$report" \
            --comment "$comment" \
            --labels "${{ steps.labels.outputs.value }}"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "comment=$comment" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload governance artifacts (Brand ${{ matrix.brand }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tokens-governance-${{ matrix.brand }}-${{ github.run_id }}
          path: |
            ${{ steps.governance.outputs.report }}
            ${{ steps.governance.outputs.comment }}
          if-no-files-found: warn

      - name: Publish governance comment (Brand ${{ matrix.brand }})
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const filePath = path.resolve(process.env.GITHUB_WORKSPACE, '${{ steps.governance.outputs.comment }}');
            if (!fs.existsSync(filePath)) {
              core.warning(`Governance comment file not found at ${filePath}`);
              return;
            }
            const body = fs.readFileSync(filePath, 'utf8').trim();
            if (!body) {
              core.warning('Governance comment body empty, skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce governance result (Brand ${{ matrix.brand }})
        if: steps.governance.outputs.status != '0'
        run: |
          echo "tokens-governance exited with status ${{ steps.governance.outputs.status }} for brand ${{ matrix.brand }}"
          exit 1

  guardrails:
    name: guardrails-check
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # s174 m02 — this job is state-assessment's SECOND caller (`--guardrails --tokens`),
          # and it ran under the default depth-1 checkout where no base ref could ever resolve.
          # Un-vacuating the tokens leg without this would have made the job permanently red.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      # s174 m02 — the same two inputs the tokens-governance job threads, for the same reason:
      # this job's `--tokens` leg runs the identical governance diff, and without a base ref it
      # was diffing nothing while reporting green. Labels are queried live so a label applied
      # after the push (or a re-run) is seen.
      - name: Collect PR labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            labels=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" --jq '[.[].name] | join(",")')
          else
            labels=""
          fi
          echo "value=$labels" >> "$GITHUB_OUTPUT"

      - name: Resolve token-governance base ref
        run: |
          if [ -n "$GITHUB_BASE_REF" ]; then
            base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
            echo "TOKEN_GOV_BASE_REF=$base" >> "$GITHUB_ENV"
            echo "Token governance diffs against $base (merge-base of origin/$GITHUB_BASE_REF and HEAD)."
          else
            echo "No GITHUB_BASE_REF on this event — the tokens leg will report a NAMED SKIP."
          fi

      - name: Run guardrail snapshots
        env:
          PR_LABELS: ${{ steps.labels.outputs.value }}
        run: node scripts/state-assessment.mjs --guardrails --tokens

      - name: Upload guardrail artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardrails-state-${{ github.run_id }}
          path: |
            artifacts/state/guardrails.json
            artifacts/state/tokens.json
            diagnostics.json
          if-no-files-found: warn

  component-packages:
    name: component-packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Historical baseline-fold contracts use git show.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oods/tokens run build
      # Historical component contracts import the built MCP readiness resolver.
      - run: pnpm run build:packages
      - run: pnpm exec playwright install chromium
      - name: Four component package suites (includes shared styles browser proof)
        run: node scripts/product-reality/component-package-suite.mjs component-contracts component-styles components-react components-vue

  runtime-cells:
    name: runtime-cells
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:tokens
      - run: pnpm run build:packages
      - name: Measure all single-screen and workflow cells from one tarball sweep
        run: pnpm exec tsx scripts/product-reality/s193-runtime-cells.ts artifacts/product-reality/sprint-193/m03-ci --workflows
      - name: Reject missing, failed, or historical cells
        env:
          OODS_RUNTIME_REPORT: ${{ github.workspace }}/artifacts/product-reality/sprint-193/m03-ci/runtime-cells.v1.json
        run: pnpm --filter @oods/mcp-server exec vitest run test/product-reality/runtime-cells.s193.spec.ts test/product-reality/workflow-runtime.s193.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-cells
          path: artifacts/product-reality/sprint-193/m03-ci

  a11y-contract:
    name: a11y-contract
    runs-on: ubuntu-latest
    # 15m was chronically tight for build-storybook + the Playwright Chromium
    # download + the a11y run, intermittently timing out on the install step.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build tw-variants package
        run: pnpm --filter @oods/tw-variants run build

      - name: Build component contracts (billing story dependency)
        run: pnpm --filter @oods/component-contracts run build

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium)
        # Dropped --with-deps: it apt-installs system libs under root and chronically
        # HUNG ~24min (the s125/s126 a11y-contract 25min timeouts), while build-storybook
        # itself is only ~46s. ubuntu-24.04 hosted runners already ship Chromium's system
        # libs; the cache above skips the browser download on a hit, and a genuine missing
        # lib now fails fast with a clear error instead of a 24-minute hang.
        run: pnpm exec playwright install chromium

      - name: Build governed component packages
        run: pnpm --filter @oods/component-styles --filter @oods/components-react --filter @oods/components-vue run build

      - name: React and Vue six-scope component proof
        # Explicitly exercise all six cells, retaining new evidence separately from
        # the frozen Sprint 182 raster receipts. Computed assertions are the gate.
        run: |
          pnpm --filter @oods/components-react run test:visual --cells=A-light,A-dark,A-hc,B-light,B-dark,B-hc --output=artifacts/component-proof/react
          pnpm --filter @oods/components-vue run test:visual --cells=A-light,A-dark,A-hc,B-light,B-dark,B-hc --output=artifacts/component-proof/vue
          pnpm --filter @oods/component-styles exec vitest run test/high-contrast.browser.spec.ts

      - name: Upload governed component theme proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-theme-${{ github.run_id }}
          path: artifacts/component-proof/
          if-no-files-found: error

      - name: Brand cascade rendered-surface proof (sprint-168 m06)
        # Reuses the Chromium this job already installs. Paints every bridged --theme-*
        # slot in all six brand x theme cells and asserts the computed colour equals the
        # value the brand token source declares — the only check in the repo that proves
        # a real engine resolves the brand cascade rather than that a file contains text.
        run: pnpm run verify:brand-cascade

      - name: Run accessibility contract
        run: pnpm run a11y:diff

      # s173 m04 — the mobile behavioural leg rides HERE rather than in a new job, and the
      # reason is measured rather than assumed: this job already does the two expensive things
      # the specs need. It builds `storybook-static` (step above) and installs Chromium (step
      # above), which is also why the a11y contract can serve the static build on an ephemeral
      # port. A separate job would repeat a ~16s build and a browser install for three spec
      # files. (s174 m03 corrects the historical count this comment carried: that workflow
      # had 13 jobs, not 15, and s174 added none.)
      #
      # s174 m03 adds the DESKTOP project to the same leg. Of the two surviving desktop specs,
      # form.accessibility had an invalid id from its 2025-10-19 introduction (d6f2567), while
      # toast's id died in the 2025-10-21 taxonomy normalization (488191c). Nobody noticed,
      # because no CI job ran that project at all. A fix with no runner would just rot again.
      #
      # Both legs are behavioural only — computed layout, focus, Esc, axe with the drawer OPEN,
      # aria-describedby wiring, toast focus restoration — so there are no screenshots to store
      # and no baselines to drift.
      - name: Mobile + desktop behavioural guardrails (375 + 768 + 1280)
        run: |
          # python3 + curl rather than `npx http-server`/`npx wait-on`: neither is a
          # dependency here, so npx would fetch them from the network on every run. Both of
          # these ship on the runner. Same mechanism the local run uses.
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:6006/index.json > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:6006/index.json > /dev/null
          STORYBOOK_EXTERNAL=1 STORYBOOK_URL=http://127.0.0.1:6006 pnpm run vrt:mobile
          STORYBOOK_EXTERNAL=1 STORYBOOK_URL=http://127.0.0.1:6006 pnpm run vrt:desktop

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-guardrail-${{ github.run_id }}
          path: tools/a11y/reports/
          if-no-files-found: warn

  vr-test:
    name: vr-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Visual regression is non-blocking — Chromatic results are advisory until token is provisioned.
    # Reverse to enforce mode by setting CHROMATIC_PROJECT_TOKEN and removing continue-on-error.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Guard on Chromatic token
        id: chromatic_token
        run: |
          if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_PROJECT_TOKEN secret is not set — skipping visual regression run."
          fi

      - name: Checkout repository
        if: steps.chromatic_token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        if: steps.chromatic_token.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        if: steps.chromatic_token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: steps.chromatic_token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        if: steps.chromatic_token.outputs.present == 'true'
        run: pnpm run build:tokens

      - name: Build tw-variants package
        if: steps.chromatic_token.outputs.present == 'true'
        run: pnpm --filter @oods/tw-variants run build

      - name: Build packages
        if: steps.chromatic_token.outputs.present == 'true'
        run: pnpm run build:packages

      - name: Cache Storybook build
        if: steps.chromatic_token.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/storybook
          key: ${{ runner.os }}-sb-${{ hashFiles('pnpm-lock.yaml', '.storybook/**', 'src/**', 'apps/**') }}
          restore-keys: |
            ${{ runner.os }}-sb-

      - name: Build Storybook
        if: steps.chromatic_token.outputs.present == 'true'
        run: pnpm run build-storybook

      - name: Publish to Chromatic
        if: steps.chromatic_token.outputs.present == 'true'
        uses: chromaui/action@v1
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          workingDir: .
          storybookBuildDir: storybook-static
          autoAcceptChanges: main
          # Do not fail the job on visual diffs; reviewers will approve changes in Chromatic UI
          exitZeroOnChanges: true

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # Product-reality proofs replay committed baselines and launch generated
    # consumers in Chromium. The expanded suite continues into four sequential
    # compiler/package proofs after the root coverage run, so retain headroom.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install chromium

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Run coverage suite
        run: pnpm run test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
          if-no-files-found: warn

  scale-determinism:
    name: scale-determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Q1 determinism gate — mission-graph V2 axis #7. Runs map.apply at
    # 100/500/1000 mapping states in parallel via vitest's default threads
    # pool. The 3-sprint reproducibility streak (s105 baseline → s106/s107
    # sustain = 3/3) is complete, so per #614 this is now a standing release
    # gate verified at the #408 sprint-closeout boundary (see
    # cmos/foundational-docs/quality-bars.md); this CI job runs it per-PR for
    # early signal.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The viz scale tier (test/scale/viz-determinism.spec.ts) imports the built
      # @oods/viz-core, so the workspace packages must be built first.
      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build packages
        run: pnpm run build:packages

      - name: Run scale-tier suite
        run: pnpm --filter @oods/mcp-server run test:scale

  viz-determinism:
    name: viz-determinism
    runs-on: ubuntu-latest
    # The full MCP suite includes the product-reality history and browser proofs;
    # its retained local closeout run is approximately nine minutes by itself.
    timeout-minutes: 25
    # sprint-110 m05: close the CI gap where the data-aware recommender's own
    # suites do NOT run under root CI. Runs @oods/viz-core's tests (profiler /
    # intent / scorer + the committed golden profiles + the sprint-111 network/
    # hierarchy + sprint-112 geo ECharts-option goldens), the colocated viz.render
    # render-fidelity + handler + network-fidelity + geo-fidelity goldens, and the
    # mcp-bridge tool-surface test (#696b) — so a recommender/profiler/adapter
    # determinism regression FAILS root CI, not just `pnpm --filter`.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright (Chromium)
        run: pnpm exec playwright install chromium

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build packages
        run: pnpm run build:packages

      - name: Record certified runtime axes
        run: node -e 'console.log(JSON.stringify({node:process.version,v8:process.versions.v8,platform:process.platform,arch:process.arch}))'

      # s149 #832 — LOAD-BEARING, DO NOT DROP: this single line is the ONLY CI gate for
      # viz-core src specs (packages/viz-core/src/**/*.spec.ts). The ROOT vitest 'core'
      # project (vitest.config.ts) does NOT glob packages/viz-core/src/**, so the colocated
      # mutation/tripwire guards — oods-vega-config.spec.ts (chrome + F6c rect-only),
      # oods-echarts-chrome-bake.spec.ts, vega-lite-adapter.spec.ts (palette bake + #853a),
      # fallback-palette-v146.spec.ts (#864/#869) — fire in CI SOLELY here. Remove this and
      # they go dark while still "present" in the tree.
      - name: Run @oods/viz-core suite (profiler + recommender + golden profiles)
        run: pnpm --filter @oods/viz-core test

      - name: Run @oods/viz-render suite (VL->SVG emitter determinism + SVG golden)
        run: pnpm --filter @oods/viz-render test

      - name: Run colocated viz.render + dashboard.render goldens
        run: pnpm --filter @oods/mcp-server exec vitest run src/tools/viz.render.test.ts src/tools/viz.render.svg.test.ts src/tools/viz.render.fidelity.test.ts src/tools/viz.render.network-fidelity.test.ts src/tools/viz.render.geo-fidelity.test.ts src/tools/viz.render.intent.test.ts src/tools/dashboard.render.test.ts src/tools/dashboard.render.fidelity.test.ts src/tools/dashboard.render.faostat-e2e.test.ts src/tools/dashboard.render.strict-fields.test.ts src/tools/dashboard.render.kpi-types.test.ts src/tools/dashboard.render.measure-depth.test.ts src/tools/repl.render.skin-mapping.test.ts src/tools/repl.render.brand.test.ts src/tools/ci-golden-list.guard.test.ts

      # s176 m04 — the FULL @oods/mcp-server suite. Before this step CI executed only the
      # 14 colocated files named above plus the root 'core' project's test/** globs: 58
      # colocated src/**/*.test.ts files were present in the tree but never ran in ANY CI
      # job. This runs the package's whole vitest surface (src colocated + test/; the
      # scale-determinism and ECharts soak suites are excluded by the package config and
      # keep their own jobs).
      # The named-goldens step above STAYS — its explicit list is guarded by
      # ci-golden-list.guard.test.ts and keeps the golden set legible — so the 14 run
      # twice, which is the price of a legible golden roster. Suite measured green at the
      # s176 build tree (211 files / 4330 tests, ~104s local wall with the s176
      # render-backed certify suites; it was 20.41s at 4f64bcf before certify rendered).
      - name: Run FULL @oods/mcp-server suite (previously-dark colocated files)
        run: pnpm --filter @oods/mcp-server test

      - name: Run mcp-bridge tool-surface test
        run: pnpm --filter @oods/mcp-bridge test

  echarts-render-soak:
    name: echarts-render-soak
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # s179 m06: opt-in, sequential worker-isolation/resource gate. The package
    # command runs Vitest under --expose-gc; build:packages is load-bearing
    # because worker_threads executes @oods/viz-render's real dist entry.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build packages for the real ECharts worker entry
        run: pnpm run build:packages

      - name: Record certified runtime axes
        run: node -e 'console.log(JSON.stringify({node:process.version,v8:process.versions.v8,platform:process.platform,arch:process.arch}))'

      - name: Run ECharts concurrency and resource soak
        run: pnpm --filter @oods/mcp-server run test:echarts-soak

  portable-runtime:
    name: portable-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 9.12.2
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Record source lockfile hash
        run: sha256sum pnpm-lock.yaml > "$RUNNER_TEMP/pnpm-lock.before.sha256"

      - name: Install repository dependencies without lockfile movement
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm run build:tokens

      - name: Build packages
        run: pnpm run build:packages

      - name: Build MCP server runtime
        run: pnpm --filter @oods/mcp-server run build

      - name: Verify adapter EOF lifecycle
        run: node --test packages/mcp-adapter/test-s181-lifecycle.js

      - name: Assemble the portable runtime twice
        run: |
          node scripts/runtime/assemble.mjs \
            --out-dir "$RUNNER_TEMP/forge-runtime-out-1" \
            --work-dir "$RUNNER_TEMP/forge-runtime-work-1" \
            --final
          node scripts/runtime/assemble.mjs \
            --out-dir "$RUNNER_TEMP/forge-runtime-out-2" \
            --work-dir "$RUNNER_TEMP/forge-runtime-work-2" \
            --final

      - name: Verify archive digests and compare deterministic hashes
        run: |
          (cd "$RUNNER_TEMP/forge-runtime-out-1" && sha256sum --check forge-runtime.tar.gz.sha256)
          (cd "$RUNNER_TEMP/forge-runtime-out-2" && sha256sum --check forge-runtime.tar.gz.sha256)
          cmp "$RUNNER_TEMP/forge-runtime-out-1/forge-runtime.tar.gz.sha256" "$RUNNER_TEMP/forge-runtime-out-2/forge-runtime.tar.gz.sha256"

      - name: Extract outside the checkout and run the adapter E2E
        run: |
          extract_dir="$RUNNER_TEMP/forge-e2e-$RANDOM"
          mkdir -p "$extract_dir"
          tar -xzf "$RUNNER_TEMP/forge-runtime-out-1/forge-runtime.tar.gz" -C "$extract_dir"
          node scripts/runtime/e2e.mjs \
            --extract-dir "$extract_dir" \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Verify source lockfile is unchanged
        if: always()
        run: sha256sum --check "$RUNNER_TEMP/pnpm-lock.before.sha256"
